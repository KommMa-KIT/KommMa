# -------------------------------------------------------------------
# Client IP handling
# -------------------------------------------------------------------
#
# cloudflared connects to nginx through the dedicated proxy network.
# Only that network is trusted to provide the CF-Connecting-IP header.
#
# This allows nginx to use the original visitor IP for:
# - rate limiting
# - connection limiting
# - access logging
# - proxy headers
#
# The proxy network is defined explicitly in docker-compose.yml.
#
set_real_ip_from 172.20.0.0/24;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;


# -------------------------------------------------------------------
# Rate limiting
# -------------------------------------------------------------------
#
# These zones use the resolved client IP. Because the real IP handling
# above runs first, limits are applied per original visitor IP rather
# than per cloudflared container IP.
#

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=app_zone:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;


# -------------------------------------------------------------------
# HTTP redirect
# -------------------------------------------------------------------
#
# Redirect all HTTP requests to the canonical HTTPS hostname.
#

server {
    listen 80;
    server_name kommma.com *.kommma.com;

    return 301 https://www.kommma.com$request_uri;
}


# -------------------------------------------------------------------
# Main application
# -------------------------------------------------------------------

server {
    listen 80;
    server_name www.kommma.com;

    client_max_body_size 20M;

    # Connection and request timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    # Limit simultaneous connections per client IP
    limit_conn conn_zone 20;

    include /etc/nginx/conf.d/auth.conf;


    # ----------------------------------------------------------------
    # Security headers
    # ----------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # Report-only CSP does not block resources yet.
    add_header Content-Security-Policy-Report-Only "default-src 'self'" always;


    # ----------------------------------------------------------------
    # Backend API
    # ----------------------------------------------------------------

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;

        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Backend request timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }


    # ----------------------------------------------------------------
    # Static images
    # ----------------------------------------------------------------

    location /images/ {
        limit_req zone=app_zone burst=40 nodelay;

        alias /app/data/pictures/;

        expires 7d;
        add_header Cache-Control "public";
    }


    # ----------------------------------------------------------------
    # Frontend
    # ----------------------------------------------------------------

    location / {
        limit_req zone=app_zone burst=40 nodelay;

        proxy_pass http://frontend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}